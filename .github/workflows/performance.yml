name: Performance regression fixtures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:performance
        env:
          MONOCODE_PERF_OUTPUT_DIR: ${{ runner.temp }}/monocode-performance
      - name: Publish regression measurements
        if: always()
        run: cat "$RUNNER_TEMP/monocode-performance/performance-report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monocode-performance-results
          path: ${{ runner.temp }}/monocode-performance/
          retention-days: 30
